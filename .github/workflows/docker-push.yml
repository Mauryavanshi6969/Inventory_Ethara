name: Build and Push Docker Images to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/inventory-ethara-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/inventory-ethara-backend:${{ github.sha }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/inventory-ethara-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/inventory-ethara-frontend:${{ github.sha }}

      - name: Print image links
        run: |
          echo "✅ Backend image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/inventory-ethara-backend:latest"
          echo "✅ Frontend image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/inventory-ethara-frontend:latest"
